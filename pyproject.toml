[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robocop-resolutive"
version = "0.1.0.dev0"
description = "Experimental hierarchical and memory-based robotics controllers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
sim = ["gymnasium[mujoco]>=1.0", "mujoco>=3.2", "pandas>=2.0"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
